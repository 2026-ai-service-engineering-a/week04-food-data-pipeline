# 공통 정의 — v0.1은 api + ui 두 서비스뿐이다.
#   db(PostgreSQL) 서비스는 2회전이, chroma(벡터 DB) 서비스는 3회전이 더한다.
#   인프라가 필요해지면 블록 하나를 더하는 것, 그것이 compose를 쓰는 이유다.
#
#   container_name을 쓰지 않는다. 이름을 고정하면 저장소 사본 두 개를 동시에
#   띄울 수 없고, 나중에 띄운 쪽이 앞의 컨테이너를 가져가 버린다.
#   compose가 프로젝트 이름으로 알아서 구분한다.
#
#   실행 모드: docker compose up --build
#   개발 모드: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false # v0.1은 키 없이도 뜬다 (빈 상태 안내)
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgresql://app:app@db:5432/food
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      # 복원이 끝난 뒤에 뜬다. 반쯤 놓인 파일을 읽는 사고를 막는다
      data-restore:
        condition: service_completed_successfully
      db-restore:
        condition: service_completed_successfully
      # 벡터 DB는 없어도 뜬다. 3회전이 안 온 상태에서도 검색은 돌아야 하고,
      # 의미 검색 탭만 "아직입니다"라고 말하면 된다. started로 충분한 이유다
      chroma:
        condition: service_started
    volumes:
      # data/는 파이프라인의 작업대다. 원본(raw)·정제 산출물(clean)·샘플이 모두 여기 있고,
      # 컨테이너 안에서 쓰기가 일어나므로 read-only가 아니다.
      #   호스트에서 받은 187MB 원본을 data/raw/에 두면 컨테이너에 그대로 보인다.
      #   배포된 산출물(parquet)을 data/clean/에 풀어 넣어도 마찬가지다.
      - ./data:/app/data
      - ./reports:/app/reports
      - ./scripts:/app/scripts:ro

  # 배포된 산출물을 제자리에 놓는 일회성 서비스.
  #   릴리즈에서 받은 foods_parsed.parquet 를 data/dist/ 에 두고 compose up 하면
  #   알아서 data/clean/ 으로 옮긴다. 이미 있으면 아무 것도 안 한다 (멱등).
  #   배포물이 없어도 조용히 나간다 — 직접 정제할 사람에게는 없는 게 정상이다.
  data-restore:
    image: alpine:3.20
    volumes:
      - ./data:/data
      - ./reports:/reports
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/restore.sh"]

  # 2회전이 더한 서비스. 2주차 PostgreSQL의 재등장이고, compose에서는
  # 이렇게 블록 하나를 더하는 일이다. 3회전의 chroma가 같은 패턴을 반복한다.
  db:
    image: postgres:17-alpine
    environment:
      TZ: Asia/Seoul
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: food
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      # api가 "떴다"가 아니라 "받을 준비가 됐다"를 기다리게 한다.
      # depends_on만으로는 컨테이너 기동 순서까지만 보장된다
      test: ["CMD-SHELL", "pg_isready -U app -d food"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 배포된 pg 덤프를 복원하는 일회성 서비스.
  #   parquet과 달리 덤프는 파일을 옮겨서 끝나지 않는다. db가 받을 준비가 된
  #   뒤에 돌아야 하고, api는 이게 끝나기를 기다려야 한다.
  db-restore:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/food
    volumes:
      - ./data:/data
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      # 덤프는 아카이브 안에 들어 있고, 그걸 꺼내 놓는 건 data-restore다.
      # 이 줄이 없으면 둘이 동시에 돌아 "덤프가 없습니다"를 보고 나가는
      # 경주가 된다. 그리고 그 경주는 대체로 이기다가 가끔 진다
      data-restore:
        condition: service_completed_successfully
    command: ["sh", "/scripts/restore_db.sh"]

  # 3회전이 더한 서비스. db와 같은 패턴의 세 번째 반복이다.
  #   정형 DB 옆에 벡터 DB를 나란히 둔다. 원본은 PostgreSQL 한 곳이고
  #   chroma는 색인이다 — 답에 쓸 내용은 식품코드로 원본에서 꺼낸다.
  chroma:
    image: chromadb/chroma:1.5.9 # 배포 인덱스가 이 버전으로 만들어졌다. 맞춰야 연다
    volumes:
      - ./data/chroma:/data
    environment:
      TZ: Asia/Seoul
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      # db와 같은 이유. "떴다"와 "받을 준비가 됐다"는 다르다
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      # 1.6GB 아카이브를 푸는 동안 chroma가 열면 반쯤 풀린 디렉터리를 본다
      data-restore:
        condition: service_completed_successfully

  # 인덱스를 직접 만들 사람을 위한 일회성 서비스.
  #   배포 인덱스를 받은 사람은 부를 일이 없다 (data-restore가 이미 놓았다).
  #   docker compose run --rm index-load
  #   docker compose run --rm index-load --limit 1000   # 맛보기
  index-load:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgresql://app:app@db:5432/food
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      chroma:
        condition: service_healthy
      db:
        condition: service_healthy
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "pipeline.embed_index"]
    restart: "no"
    profiles: ["tools"] # compose up에 딸려 오지 않는다. 부를 때만 돈다

  ui:
    build: ./ui
    ports:
      - "8501:8501"
    environment:
      TZ: Asia/Seoul
      # compose 네트워크에서 서비스 이름(api)이 곧 호스트명이다
      API_BASE_URL: http://api:8000
    depends_on:
      - api
